[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalframe-ml"
version = "1.0.0"
description = "Multimodal emotion & sentiment (MELD): shared model, training, and inference core."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "torch>=2.4,<2.6",
  "torchaudio>=2.4,<2.6",
  "torchvision>=0.19,<0.21",
  "transformers>=4.45,<4.48",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
train = [
  "pandas>=2.2",
  "tqdm>=4.65",
  "tensorboard>=2.17",
  "scikit-learn>=1.5",
  "soundfile>=0.12",
  "ffmpeg-python>=0.2",
]
infer = [
  "faster-whisper>=1.0",
  "soundfile>=0.12",
  "ffmpeg-python>=0.2",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["signalframe_ml*"]
